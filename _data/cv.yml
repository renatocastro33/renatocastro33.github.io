- title: Open Source Projects
  type: time_table
  contents:

    - title: <a href="https://github.com/renatocastro33/cv_social_distancing_on_jetson_nano">Computer Vision for Social Distancing on Nvidia Jetson Nano</a>
      year: 2020
      description: This repository contains a computer vision system for real-time social distancing monitoring using YOLOv3 object detection and Bird's Eye View (BEV) transformation. The system detects people, evaluates if they respect a predefined minimum distance, and provides visual feedback with bounding boxes and a BEV plot.

    - title: <a href="https://github.com/renatocastro33/People-Detection-and-Counting-In-Out-Line">People Detection and Counting In/Out Line</a>
      year: 2020
      description: A people detection using Yolo v3 and Deep Sort to count people who passes a certain line that delimits the entrance of a place. This program can count the people who get into the place or get out.

